  <!-- Bar 2 (Mid-left) -->
  <path d="M 22 44 L 42 82 C 44 85 48 85 50 82 L 68 48" 
        stroke="url(#visdomGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Bar 3 (Mid-right) -->
  <path d="M 32 33 L 56 82 C 58 85 62 85 64 82 L 88 32" 
        stroke="url(#visdomGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Bar 4 (Rightmost tall) -->
  <path d="M 42 22 L 70 82 C 72 85 76 85 78 82 L 108 12" 
        stroke="url(#visdomGrad)" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
